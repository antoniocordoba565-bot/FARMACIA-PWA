<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmacia SM/Inventario</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#059669">
</head>
<body>
    <header class="top">
        <h1>Farmacia Super Morelos</h1>
        <span class="status" id="status">Sistema en Línea</span>
    </header>

    <main>
        <section class="panel">
            <h2 class="panel-title" id="titleForm">Nuevo Medicamento</h2>
        
            <form id="form" novalidate>
                <field>
                    <label for="codigo">Código de Artículo</label>
                    <input type="text" id="codigo" name="codigo" placeholder="Ej. ART001" autocomplete="off" required>
                    <small class="ayuda">Código único o de barras</small>
                    <small class="error" id="err-codigo"></small>
                </field>
                
                <field>
                    <label for="nombre">Nombre Comercial / Descripción</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej. Paracetamol 500mg" autocomplete="off" required>
                    <small class="ayuda">Nombre y presentación</small>
                    <small class="error" id="err-nombre"></small>
                </field>

                <field>
                    <label for="formula">Fórmula / Sustancia Activa</label>
                    <input type="text" id="formula" name="formula" placeholder="Ej. Paracetamol" autocomplete="off" required>
                    <small class="ayuda">Componente principal</small>
                    <small class="error" id="err-formula"></small>
                </field>

                <field>
                    <label for="precio">Precio Público ($)</label>
                    <input type="number" step="0.01" id="precio" name="precio" placeholder="0.00" inputmode="decimal" required>
                    <small class="ayuda">Precio de venta al público</small>
                    <small class="error" id="err-precio"></small>
                </field>

                <field>
                    <label for="stock">Existencias (Stock)</label>
                    <input type="number" id="stock" name="stock" placeholder="0" inputmode="numeric" required>
                    <small class="ayuda">Cantidad disponible en sucursal</small>
                    <small class="error" id="err-stock"></small>
                </field>

                <div class="actions">
                    <button type="submit" id="save" class="btn btn-save">Guardar</button>
                    <button type="reset" id="cancel" class="btn btn-cancel" onclick="reestablecerForm()">Cancelar</button>
                </div>
            </form>
        </section>

        <section class="panel">
            <h2>Inventario de Medicamentos <span id="contador"></span></h2>
            <ul id="list" class="list"> </ul>
            <p id="vacio" class="vacio">No hay medicamentos registrados en el sistema</p>
        </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    
    <footer></footer>
    <script src="js/app.js"></script>
</body>
</html>
